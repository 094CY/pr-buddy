# origin: 094CY/pr-buddy
interface:
  display_name: "PR-Buddy"
  short_description: "通用企业产品与品牌宣发内容引擎：七类主体 × 15 类内容 × 8 个渠道，事实校准、合规边界、脚本化终检"
  default_prompt: "Use $pr-buddy to write publish-ready Chinese product and brand content for any kind of business: traditional and B2B, internet and software, AI and tech, retail and consumer goods, stores and local services, studios and micro brands, professional services. First read references/activation-checklist-10s.md and load only the files it lists for the task. Build the subject profile (Step 1.5), then verify every fact against the subject's first-hand materials (Step 1.6); never invent effects, reviews, prices or customer stories. Pass the pre-writing argument card, including the compliance boundary, before drafting. Treat AI-trace rules as context- and density-based signals, never blanket bans; do not fix the count or position of punchlines, hooks or summaries. Legal requirements in references/compliance-notes.md rank with the iron rules. Deliver .md first; generate .docx (references/md_to_docx.py) or WeChat HTML (references/brand_theme.py for brand color) only after the user confirms the final draft. Before delivery follow references/final-check.md and report actual script results instead of self-checked ticks."
